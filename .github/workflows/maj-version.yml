# Suivi automatique de la version de litemcp : la doc (README + projet
# d'exemple) suit la dernière publication crates.io. Rien n'est poussé tant
# que l'exemple ne compile pas avec la nouvelle version ; et le push déclenche
# le workflow Pages — le site suit donc aussi.

name: Suivi de version litemcp

on:
  schedule:
    - cron: '21 4 * * 1' # chaque lundi, 04:21 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-version

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la dernière version publiée sur crates.io
        id: ver
        run: |
          set -euo pipefail
          resp=$(curl -sf -A "litemcp-tuto-ci (https://github.com/DeamonDev888/litemcp-tuto)" \
            https://crates.io/api/v1/crates/litemcp)
          VER=$(printf '%s' "$resp" | jq -r '.crate.max_version')
          MINOR=$(printf '%s' "$VER" | cut -d. -f1-2)
          MSRV=$(printf '%s' "$resp" | jq -r --arg v "$VER" \
            '.versions[] | select(.num==$v) | .rust_version // empty')
          {
            echo "ver=$VER"
            echo "minor=$MINOR"
            echo "msrv=$MSRV"
          } >> "$GITHUB_OUTPUT"
          echo "dernière publiée : $VER (mineur $MINOR, MSRV ${MSRV:-inconnue})"

      - name: Mettre à jour README.md et le projet d'exemple
        run: |
          set -euo pipefail
          MINOR="${{ steps.ver.outputs.minor }}"
          # Lignes de dépendance : litemcp = "0.X" (les deux formes).
          sed -i -E "s|litemcp = \"[0-9]+\.[0-9]+\"|litemcp = \"$MINOR\"|g" \
            README.md mon-premier-mcp/Cargo.toml
          sed -i -E "s|litemcp = \{ version = \"[0-9]+\.[0-9]+\"|litemcp = { version = \"$MINOR\"|" README.md
          # MSRV (badges + texte prérequis + rust-version), si crates.io la publie.
          MSRV="${{ steps.ver.outputs.msrv }}"
          if [ -n "$MSRV" ]; then
            sed -i -E \
              -e "s|Rust-[0-9]+\.[0-9]+%2B|Rust-$MSRV%2B|g" \
              -e "s|alt=\"Rust [0-9]+\.[0-9]+\+\"|alt=\"Rust $MSRV+\"|g" \
              -e "s|cargo [0-9]+\.[0-9]+\.0 \(ou plus récent\)|cargo $MSRV.0 (ou plus récent)|g" \
              README.md
            sed -i -E "s|rust-version = \"[0-9]+\.[0-9]+\"|rust-version = \"$MSRV\"|" \
              mon-premier-mcp/Cargo.toml
          fi
          git diff --stat || true

      - name: Vérifier que l'exemple compile avec cette version
        working-directory: mon-premier-mcp
        run: |
          command -v cargo >/dev/null 2>&1 || rustup toolchain install stable --profile minimal
          cargo build --quiet
          echo "exemple compilé avec litemcp ${{ steps.ver.outputs.ver }} : doc à jour publiable"

      - name: Publier la mise à jour (si changements)
        run: |
          if git diff --quiet; then
            echo "doc déjà à jour (mineur ${{ steps.ver.outputs.minor }}) — rien à pousser"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md mon-premier-mcp/Cargo.toml
          git commit -m "doc : suivi automatique de litemcp ${{ steps.ver.outputs.ver }} (build de l'exemple vérifié)"
          git push
