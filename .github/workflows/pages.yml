# Site web du tuto (GitHub Pages) — deux pages générées depuis les deux tutos :
#   index.html  <- README.md     (tuto humain)
#   agent.html  <- TUTO-AGENT.md (mode d'emploi pour agent IA)
# Une seule source de vérité par page ; les liens croisés sont réécrits.

name: Site du tuto (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer pandoc si absent
        run: command -v pandoc >/dev/null || (sudo apt-get update && sudo apt-get install -y pandoc)

      - name: Générer le site (README.md et TUTO-AGENT.md -> HTML)
        run: |
          mkdir -p site
          # Enveloppe de page : navigation entre les deux documents, barre de
          # progression de lecture, pied de page, retour en haut.
          cat > site/_avant.html <<'HTML'
          <div class="progress"></div>
          <header class="topbar">
            <a class="marque" href="index.html"><span class="point"></span><span class="nom">LiteMCP · le tuto</span><span class="nom-court">LiteMCP</span></a>
            <nav>
              <a href="index.html" data-page="index.html">Tuto humain</a>
              <a href="agent.html" data-page="agent.html">Mode d'emploi agent</a>
              <a href="https://github.com/DeamonDev888/litemcp" target="_blank" rel="noopener">GitHub ↗</a>
            </nav>
          </header>
          <main class="page">
          HTML
          cat > site/_apres.html <<'HTML'
          </main>
          <footer class="site-footer">
            <p>Le code de ce tuto : <a href="https://github.com/DeamonDev888/litemcp-tuto">github.com/DeamonDev888/litemcp-tuto</a><br>
               la lib : <a href="https://github.com/DeamonDev888/litemcp">LiteMCP</a> — <a href="https://github.com/DeamonDev888/litemcp">⭐ mettez-lui une étoile</a>, c'est ce qui la fait vivre · site régénéré depuis le README à chaque push.</p>
          </footer>
          <a class="haut" href="#" title="Retour en haut" aria-label="Retour en haut">↑</a>
          <script src="site.js" defer></script>
          HTML

          # Prépare une source : réécrit le lien vers le code du tuto.
          # (Le retrait de la table des matières interne et l'insertion du
          # schéma se font en Python, insensibles à la casse et aux CRLF.)
          preparer () {
            src="$1"; dst="$2"
            sed 's|](\./mon-premier-mcp)|](https://github.com/DeamonDev888/litemcp-tuto/tree/main/mon-premier-mcp)|g' "$src" > "$dst"
          }

          preparer README.md site/tuto.md
          preparer TUTO-AGENT.md site/agent.md

          python3 - <<'PY'
          import pathlib

          def sans_sommaire(t):
              lignes = t.replace("\r\n", "\n").split("\n")
              debut = None
              for i, l in enumerate(lignes):
                  if l.startswith("## ") and "table des mati" in l.lower():
                      debut = i
                      break
              if debut is None:
                  return "\n".join(lignes)
              fin = len(lignes) - 1
              for j in range(debut + 1, len(lignes)):
                  if lignes[j].strip() == "---":
                      fin = j
                      break
              return "\n".join(lignes[:debut] + lignes[fin + 1:])

          svg = pathlib.Path("assets/hero-flow.svg").read_text(encoding="utf-8").strip()

          h = pathlib.Path("site/tuto.md")
          t = sans_sommaire(h.read_text(encoding="utf-8"))
          i = t.index("</div>") + len("</div>")
          h.write_text(t[:i] + "\n\n" + svg + "\n" + t[i:], encoding="utf-8", newline="\n")

          a = pathlib.Path("site/agent.md")
          t = sans_sommaire(a.read_text(encoding="utf-8"))
          i = t.index("</div>") + len("</div>")
          a.write_text(t[:i] + "\n\n" + svg + "\n" + t[i:], encoding="utf-8", newline="\n")
          PY

          # Page 1 : index.html (tuto humain)
          sed -i 's|](TUTO-AGENT.md)|](agent.html)|g' site/tuto.md
          pandoc site/tuto.md \
            -f gfm+gfm_auto_identifiers -t html5 -s \
            --toc --toc-depth=2 \
            --highlight-style breezedark \
            --metadata title="Mon serveur MCP — le tuto LiteMCP" \
            --metadata lang=fr \
            --include-before-body site/_avant.html \
            --include-after-body site/_apres.html \
            -c style.css \
            -o site/index.html

          # Page 2 : agent.html (mode d'emploi pour agent IA)
          sed -i 's|](README.md)|](index.html)|g; s|](TUTO-AGENT.md)|](agent.html)|g' site/agent.md
          pandoc site/agent.md \
            -f gfm+gfm_auto_identifiers -t html5 -s \
            --toc --toc-depth=2 \
            --highlight-style breezedark \
            --metadata title="Mode d'emploi du serveur MCP — pour agent IA" \
            --metadata lang=fr \
            --include-before-body site/_avant.html \
            --include-after-body site/_apres.html \
            -c style.css \
            -o site/agent.html

          cp style.css site/style.css
          # Images du README (captures d'écran) et script de confort
          [ -d assets ] && cp -r assets site/ || true
          cp assets/site.js site/site.js
          rm site/tuto.md site/agent.md site/_avant.html site/_apres.html

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
