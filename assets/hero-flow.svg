<text x="236" y="168" fill="#8fa0b5" font-size="11" font-family="inherit">r&#233;ponse</text>
</g>
<g class="flow-paquets">
<circle class="paquet p1" cx="192" cy="104" r="4.5" fill="#2ecc71"/>
<circle class="paquet p2" cx="612" cy="104" r="4.5" fill="#2ecc71"/>
<circle class="paquet p3" cx="754" cy="150" r="4.5" fill="#7fb2e5"/>
<circle class="paquet p4" cx="384" cy="150" r="4.5" fill="#7fb2e5"/>
</g>
<text x="500" y="226" text-anchor="middle" fill="#6e7d91" font-size="12" font-family="inherit">Rien de magique : votre code, appel&#233; au bon moment, avec les bons arguments.</text>
</svg>
</figure>
